<!DOCTYPE html>
<html><head>
<title>WebRTCsays.ai Talking Face Demo</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
#log { white-space: pre-wrap; height: 500px; overflow-y: auto; border: 1px solid #333; padding: 10px; }
button { background: #0a0; color: #000; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
button:disabled { background: #333; color: #666; }
button.hangup { background: #a00; color: #fff; }
#remoteAudio { width: 320px; margin-top: 8px; }
video { width: 320px; height: 240px; background: #222; border: 1px solid #333; }
.video-wrap { position: relative; width: 320px; height: 240px; }
.meter {
  position: absolute;
  top: 4px;
  bottom: 4px;
  width: 12px;
  border: 1px solid #335;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  pointer-events: none;
}
.meter-left { left: 4px; }
.meter-right { right: 4px; }
.meter-fill {
  width: 100%;
  height: 0%;
  background: linear-gradient(to top, #0f0 0%, #9f0 55%, #ff0 80%, #f33 100%);
  transition: height 70ms linear;
}
.meter-label {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: #9f9;
}
</style>
</head>
<body>
<h2>WebRTCsays.ai Talking Face Demo</h2>
<div>
  <button id="btn" onclick="call()">Call AI Avatar</button>
  <button onclick="hangup()">Hang Up</button>
  <span id="state" style="margin-left:20px">Idle</span>
</div>
<p>Open the local signal bridge, call the callee, and the remote video panel will show the animated avatar stream.</p>
<div class="video-wrap">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="meter meter-left" title="OUT: your mic to AI">
    <div class="meter-label">OUT</div>
    <div id="meterOut" class="meter-fill"></div>
  </div>
  <div class="meter meter-right" title="IN: AI audio to you">
    <div class="meter-label">IN</div>
    <div id="meterIn" class="meter-fill"></div>
  </div>
</div>
<audio id="remoteAudio" autoplay></audio>
<div id="log"></div>

<script>
let pc, localStream, remoteStream, statsId, audioKickId;
let meterRaf = 0, audioCtx = null;
let outSource = null, inSource = null;
let outAnalyser = null, inAnalyser = null;
let outData = null, inData = null;
const ROOM = new URLSearchParams(window.location.search).get('room') ||
  ('room-local-avatar-' + Math.random().toString(36).slice(2, 10));
const log = (m) => { 
  const d = document.getElementById('log');
  d.textContent += new Date().toLocaleTimeString() + ' ' + m + '\n';
  d.scrollTop = d.scrollHeight;
};
log('Using room: ' + ROOM);
const setState = (s) => document.getElementById('state').textContent = s;
const meterOutEl = () => document.getElementById('meterOut');
const meterInEl = () => document.getElementById('meterIn');

function stopMeters() {
  if (meterRaf) cancelAnimationFrame(meterRaf);
  meterRaf = 0;
  if (outSource) { try { outSource.disconnect(); } catch (_) {} outSource = null; }
  if (inSource) { try { inSource.disconnect(); } catch (_) {} inSource = null; }
  outAnalyser = null; inAnalyser = null; outData = null; inData = null;
  meterOutEl().style.height = '0%';
  meterInEl().style.height = '0%';
}

function levelPercent(analyser, data) {
  if (!analyser || !data) return 0;
  analyser.getByteTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / data.length);
  const p = Math.min(1, rms * 3.0);
  return Math.round(p * 100);
}

function animateMeters() {
  const outP = levelPercent(outAnalyser, outData);
  const inP = levelPercent(inAnalyser, inData);
  meterOutEl().style.height = outP + '%';
  meterInEl().style.height = inP + '%';
  meterRaf = requestAnimationFrame(animateMeters);
}

async function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch (_) {}
  }
}

async function initOutMeter(stream) {
  if (!stream) return;
  await ensureAudioCtx();
  if (outSource) { try { outSource.disconnect(); } catch (_) {} outSource = null; }
  outAnalyser = audioCtx.createAnalyser();
  outAnalyser.fftSize = 512;
  outData = new Uint8Array(outAnalyser.fftSize);
  outSource = audioCtx.createMediaStreamSource(stream);
  outSource.connect(outAnalyser);
  if (!meterRaf) meterRaf = requestAnimationFrame(animateMeters);
}

async function initInMeter(stream) {
  if (!stream) return;
  await ensureAudioCtx();
  if (inSource) { try { inSource.disconnect(); } catch (_) {} inSource = null; }
  inAnalyser = audioCtx.createAnalyser();
  inAnalyser.fftSize = 512;
  inData = new Uint8Array(inAnalyser.fftSize);
  inSource = audioCtx.createMediaStreamSource(stream);
  inSource.connect(inAnalyser);
  if (!meterRaf) meterRaf = requestAnimationFrame(animateMeters);
}

async function call() {
  document.getElementById('btn').disabled = true;
  setState('Getting mic...');
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio: true});
    log('Mic OK');
    initOutMeter(localStream);
  } catch(e) {
    log('Mic error: ' + e.message);
    localStream = null;
  }

  // Connect TCP via bridge signal relay on localhost
  // Since we're local, connect directly to signal_bridge's HTTP relay
  setState('Creating PeerConnection...');
  
  pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });
  remoteStream = new MediaStream();
  const remoteVideo = document.getElementById('remoteVideo');
  const remoteAudio = document.getElementById('remoteAudio');
  remoteVideo.srcObject = remoteStream;
  remoteVideo.muted = true; // keep audio path on dedicated <audio> element
  remoteAudio.srcObject = remoteStream;
  remoteAudio.autoplay = true;
  remoteAudio.muted = false;
  remoteAudio.volume = 1.0;
  remoteAudio.controls = true;

  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (ev) => {
    log('Remote track: ' + ev.track.kind);
    if (!remoteStream.getTracks().includes(ev.track)) remoteStream.addTrack(ev.track);
    ev.track.onunmute = () => log('Remote ' + ev.track.kind + ' unmuted');
    ev.track.onmute = () => log('Remote ' + ev.track.kind + ' muted');
    ev.track.onended = () => log('Remote ' + ev.track.kind + ' ended');
    if (ev.track.kind === 'audio') {
      const tryPlayAudio = () => remoteAudio.play().catch((e) => log('Remote audio play err: ' + e.message));
      remoteAudio.onloadedmetadata = tryPlayAudio;
      tryPlayAudio();
      initInMeter(remoteStream);
      log('Playing remote audio');
    }
    if (ev.track.kind === 'video') {
      const tryPlayVideo = () => remoteVideo.play().catch((e) => log('Remote video play err: ' + e.message));
      remoteVideo.onloadedmetadata = tryPlayVideo;
      tryPlayVideo();
      log('Playing remote video');
    }
  };

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      log('Local ICE: ' + ev.candidate.candidate.substr(0, 60));
      signal('post', 'caller', {type:'ice', candidate: ev.candidate});
    }
  };

  pc.oniceconnectionstatechange = () => {
    log('ICE: ' + pc.iceConnectionState);
    setState('ICE: ' + pc.iceConnectionState);
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      log('*** CONNECTED - speak into your mic! ***');
      setState('CONNECTED');
    }
    if (pc.iceConnectionState === 'failed') {
      log('ICE FAILED');
      setState('FAILED');
      document.getElementById('btn').disabled = false;
    }
  };

  pc.onconnectionstatechange = () => log('Connection: ' + pc.connectionState);
  startAudioStats();

  // Start polling for callee messages
  startPoll();

  // Reset and send offer
  await signal('reset', 'caller');
  const offer = await pc.createOffer({offerToReceiveAudio: true, offerToReceiveVideo: true});
  await pc.setLocalDescription(offer);
  log('Offer created (' + offer.sdp.length + ' bytes)');
  
  await signal('post', 'caller', {type:'offer', sdp: offer.sdp});
  log('Offer sent to signal relay');
  setState('Waiting for answer...');
}

let pollId;
function startAudioStats() {
  if (statsId) clearInterval(statsId);
  if (audioKickId) clearInterval(audioKickId);
  statsId = setInterval(async () => {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      for (const report of stats.values()) {
        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
          log('Audio stats: packets=' + report.packetsReceived + ' bytes=' + report.bytesReceived + ' jitter=' + report.jitter + ' level=' + (report.audioLevel ?? 'n/a'));
          break;
        }
      }
    } catch (_) {}
  }, 1000);

  audioKickId = setInterval(() => {
    const remoteAudio = document.getElementById('remoteAudio');
    if (!remoteAudio || !pc) return;
    if (pc.connectionState !== 'connected') return;
    if (remoteAudio.paused) {
      remoteAudio.play().catch((e) => log('Audio retry play err: ' + e.message));
    }
    log('Audio element: paused=' + remoteAudio.paused + ' muted=' + remoteAudio.muted + ' volume=' + remoteAudio.volume + ' readyState=' + remoteAudio.readyState);
  }, 2000);
}

function startPoll() {
  if (pollId) clearInterval(pollId);
  pollId = setInterval(async () => {
    const data = await signal('poll', 'caller');
    for (const msg of (data.messages || [])) {
      if (msg.type === 'answer') {
        log('Got ANSWER (' + msg.sdp.length + ' bytes)');
        // Log candidates in answer SDP
        msg.sdp.split('\n').forEach(l => {
          if (l.includes('candidate')) log('  Answer candidate: ' + l.trim());
        });
        await pc.setRemoteDescription({type:'answer', sdp: msg.sdp});
        setState('Answer set, ICE checking...');
      } else if (msg.type === 'ice' && msg.candidate) {
        log('Remote ICE: ' + JSON.stringify(msg.candidate).substr(0, 80));
        try { await pc.addIceCandidate(msg.candidate); } catch(e) { log('ICE add err: ' + e.message); }
      } else if (msg.type === 'status') {
        log('Protocol status [' + (msg.stage || 'callee') + ']: ' + (msg.status || ''));
        const st = String(msg.status || '');
        if (st.startsWith('486')) setState('Busy (486)');
        if (st.startsWith('480')) setState('Unavailable (480)');
        if (st.startsWith('400')) setState('Bad Request (400)');
      } else if (msg.type === 'llama') {
        log('LLAMA: ' + (msg.text || '').substring(0, 160));
      }
    }
  }, 400);
}

async function hangup() {
  try { await signal('post', 'caller', {type:'hangup'}); } catch (e) { log('Hangup signal err: ' + e.message); }
  if (pollId) { clearInterval(pollId); pollId = null; }
  if (statsId) { clearInterval(statsId); statsId = null; }
  if (audioKickId) { clearInterval(audioKickId); audioKickId = null; }
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  const remoteAudio = document.getElementById('remoteAudio');
  const remoteVideo = document.getElementById('remoteVideo');
  remoteAudio.srcObject = null;
  remoteVideo.srcObject = null;
  remoteStream = null;
  stopMeters();
  setState('Idle');
  document.getElementById('btn').disabled = false;
  log('Hung up');
}

async function signal(action, role, body) {
  const url = '/signal?action=' + action + '&role=' + role + '&room=' + encodeURIComponent(ROOM);
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const res = await fetch(url, opts);
  return res.json();
}
</script>
</body>
</html>
