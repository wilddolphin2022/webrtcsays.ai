name: Build Whillats

on:
  workflow_dispatch:
    inputs:
      whillats_ref:
        description: "Whillats branch/tag/SHA to build"
        required: false
        default: "develop"
      build_type:
        description: "Build type"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      enable_cuda:
        description: "Enable CUDA GPU acceleration"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout webrtcsays.ai (for submodule reference)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Override whillats ref if specified
        if: inputs.whillats_ref != 'develop'
        run: |
          cd modules/third_party/whillats
          git fetch origin ${{ inputs.whillats_ref }}
          git checkout ${{ inputs.whillats_ref }}
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git autoconf automake libtool \
            pkg-config libasound2-dev

      - name: Build whillats library
        run: |
          WHILLATS_DIR="modules/third_party/whillats"
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}"
          if [ "${{ inputs.enable_cuda }}" = "true" ]; then
            CMAKE_ARGS="${CMAKE_ARGS} -DGGML_CUDA=ON"
          else
            CMAKE_ARGS="${CMAKE_ARGS} -DGGML_CUDA=OFF -DWHISPER_CUDA=OFF -DGGML_CUBLAS=OFF -DLLAMA_CUDA=OFF"
          fi
          cmake -S "${WHILLATS_DIR}" -B "${WHILLATS_DIR}/build" ${CMAKE_ARGS}
          cmake --build "${WHILLATS_DIR}/build" --config ${{ inputs.build_type }} --parallel $(nproc)

      - name: Run whillats tests
        run: |
          WHILLATS_DIR="modules/third_party/whillats"
          if [ -f "${WHILLATS_DIR}/build/bin/${{ inputs.build_type }}/test_whillats" ]; then
            echo "Running whillats tests..."
            "${WHILLATS_DIR}/build/bin/${{ inputs.build_type }}/test_whillats" || true
          else
            echo "No test binary found, skipping"
          fi

      - name: Package artifacts
        run: |
          WHILLATS_DIR="modules/third_party/whillats"
          BUILD_TYPE="${{ inputs.build_type }}"
          mkdir -p dist/whillats-linux/lib
          cp "${WHILLATS_DIR}/build/lib/${BUILD_TYPE}/"*.so* dist/whillats-linux/lib/ 2>/dev/null || true
          cp "${WHILLATS_DIR}/build/lib/${BUILD_TYPE}/"*.a dist/whillats-linux/lib/ 2>/dev/null || true
          if [ -d "${WHILLATS_DIR}/build/bin/${BUILD_TYPE}/espeak-ng-data" ]; then
            cp -a "${WHILLATS_DIR}/build/bin/${BUILD_TYPE}/espeak-ng-data" dist/whillats-linux/
          fi
          echo "=== Packaged artifacts ==="
          find dist/whillats-linux -type f | head -30
          tar -C dist -czf dist/whillats-linux.tar.gz whillats-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whillats-linux-${{ inputs.build_type }}
          path: dist/whillats-linux.tar.gz
          retention-days: 30
